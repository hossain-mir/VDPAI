<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antennas -->
  <line x1="32" y1="20" x2="22" y2="10" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  <circle cx="21" cy="9" r="4.5" fill="#38bdf8" />
  <line x1="68" y1="20" x2="78" y2="10" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  <circle cx="79" cy="9" r="4.5" fill="#38bdf8" />

  <!-- Ears -->
  <rect x="10" y="38" width="8" height="24" rx="4" fill="#1d4ed8" />
  <rect x="82" y="38" width="8" height="24" rx="4" fill="#1d4ed8" />

  <!-- Head -->
  <rect x="15" y="18" width="70" height="64" rx="30" fill="url(#headGrad)" />

  <!-- Face Screen / Visor -->
  <rect x="23" y="30" width="54" height="40" rx="18" fill="url(#visorGrad)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Glowing Eyes -->
  <ellipse cx="38" cy="48" rx="7" ry="9" fill="url(#eyeGrad)" filter="url(#eyeGlow)" />
  <ellipse cx="62" cy="48" rx="7" ry="9" fill="url(#eyeGrad)" filter="url(#eyeGlow)" />
  <circle cx="36" cy="45" r="2.5" fill="#ffffff" />
  <circle cx="60" cy="45" r="2.5" fill="#ffffff" />

  <!-- Cute digital smile -->
  <path d="M 44 60 Q 50 64 56 60" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cheeks -->
  <ellipse cx="28" cy="56" rx="3.5" ry="2" fill="rgba(56, 189, 248, 0.4)" />
  <ellipse cx="72" cy="56" rx="3.5" ry="2" fill="rgba(56, 189, 248, 0.4)" />
</svg>
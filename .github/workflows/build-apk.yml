name: Build JARVIS AI debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Set this as a repository variable (Settings → Secrets and variables → Actions → Variables).
# It must be the deployed HTTPS URL of the Python backend, e.g. https://jarvis.example.com
env:
  JARVIS_BACKEND_URL: ${{ vars.JARVIS_BACKEND_URL }}

jobs:
  tests:
    name: Python + frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend config.py main.py tests

      - name: Backend test suite
        run: python tests/run_tests.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies (jsdom for the HUD tests)
        run: npm ci

      - name: Frontend HUD smoke tests (29 + 19 checks)
        run: npm run test:js

  build-apk:
    name: Build Android debug APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a deployed HTTPS backend
        shell: bash
        run: |
          if [ -z "${JARVIS_BACKEND_URL}" ]; then
            echo "::error::JARVIS_BACKEND_URL repository variable is not set. Set it to your deployed HTTPS backend URL (for example https://jarvis.example.com)."
            exit 1
          fi
          echo "APK will talk to ${JARVIS_BACKEND_URL}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build www/ from the browser frontend
        run: npm run build

      - name: Generate Android icons and splash screens
        run: npm run assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor web assets into the Android project
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK actually exists
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not produced at $APK"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Build JARVIS AI debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No backend URL variable is required: the APK bundles the HUD and the owner
# enters the server address in the app after installation.

jobs:
  tests:
    name: Python + frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend config.py main.py tests

      - name: Backend test suite
        run: python tests/run_tests.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies (jsdom for the HUD tests)
        run: npm ci

      - name: Frontend HUD smoke tests (34 + 19 checks)
        run: npm run test:js

  build-apk:
    name: Build Android debug APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build www/ from the browser frontend
        run: npm run build

      - name: Generate Android icons and splash screens
        run: npm run assets

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships the Android SDK and cmdline-tools. The
      # setup-android action is no longer usable: it installs the removed
      # `tools` package and fails on current SDK manager versions.
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK is not preinstalled on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK/cmdline-tools."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor web assets into the Android project
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK actually exists
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not produced at $APK"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

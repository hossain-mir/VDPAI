name: Build JARVIS AI debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No backend URL variable is required: the APK bundles the HUD, launches
# offline, and the backend URL is configured later in System → Backend server.

jobs:
  tests:
    name: Python + frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend config.py main.py tests

      - name: Backend test suite
        run: python tests/run_tests.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies (jsdom for the HUD tests)
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in frontend/js/*.js scripts/*.mjs capacitor.config.js tests/*.mjs; do
            node --check "$file"
          done
          echo "All JavaScript modules parse."

      - name: Frontend HUD smoke tests (44 + 19 + 8 checks)
        run: npm run test:js

  build-apk:
    name: Build Android debug APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build www/ from the browser frontend
        run: npm run build

      - name: Generate Android icons and splash screens
        run: npm run assets

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships the Android SDK and cmdline-tools. The
      # setup-android action is no longer usable: it installs the removed
      # `tools` package and fails on current SDK manager versions.
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK is not preinstalled on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK/cmdline-tools."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Android XML and configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = ["android/app/src/main/AndroidManifest.xml"]
          files += glob.glob("android/app/src/main/res/**/*.xml", recursive=True)
          for path in files:
              ET.parse(path)

          manifest = open("android/app/src/main/AndroidManifest.xml", encoding="utf-8").read()
          assert "BIND_QUICK_SETTINGS_TILE" in manifest, "tile permission missing"
          assert "network_security_config" in manifest, "network security config missing"
          assert "windowSoftInputMode" in manifest, "keyboard handling missing"
          print(f"Android XML valid: {len(files)} files; manifest, tile and network config present.")
          PY

      - name: Sync Capacitor web assets into the Android project
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK actually exists
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not produced at $APK"
            exit 1
          fi
          ls -lh "$APK"

      - name: Verify Quick Settings tile is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK/build-tools" -type f -name aapt2 -perm -u+x | sort -V | tail -1)"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -q "JarvisTileService" manifest.txt
          grep -q "android.service.quicksettings.action.QS_TILE" manifest.txt
          grep -q "android.permission.BIND_QUICK_SETTINGS_TILE" manifest.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk") as apk:
              dex = [n for n in apk.namelist() if n.endswith(".dex")]
              assert dex, "APK has no dex files"
              blobs = b"".join(apk.read(n) for n in dex)
              assert b"JarvisTileService" in blobs, "tile class missing from dex"
              page = apk.read("assets/public/index.html").decode("utf-8")
              assert "bootBackendForm" not in page, "mandatory startup form still present"
              assert 'id="backendStatus"' in page, "HUD backend indicator missing"
              plugins = apk.read("assets/capacitor.plugins.json").decode("utf-8")
              assert "PreferencesPlugin" in plugins, "secure native storage plugin missing"
          PY
          echo "Tile, offline HUD and native storage are present in the APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Build VDPAI Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No backend URL variable is required: the APK bundles the HUD, launches
# offline, and the backend URL is configured later in System → Backend server.

jobs:
  tests:
    name: Python + frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend config.py main.py tests

      - name: Backend test suite
        run: python tests/run_tests.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies (jsdom for the HUD tests)
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in frontend/js/*.js scripts/*.mjs capacitor.config.js tests/*.mjs; do
            node --check "$file"
          done
          echo "All JavaScript modules parse."

      - name: Frontend checks
        run: npm run check

      - name: Frontend HUD tests
        run: npm run test:js

  build-apk:
    name: Build Android debug APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build www/ from the browser frontend
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships the Android SDK and cmdline-tools. The
      # setup-android action is no longer usable: it installs the removed
      # `tools` package and fails on current SDK manager versions.
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK is not preinstalled on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK/cmdline-tools."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Android XML and configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = ["android/app/src/main/AndroidManifest.xml"]
          files += glob.glob("android/app/src/main/res/**/*.xml", recursive=True)
          for path in files:
              ET.parse(path)

          manifest = open("android/app/src/main/AndroidManifest.xml", encoding="utf-8").read()
          assert "BIND_QUICK_SETTINGS_TILE" in manifest, "tile permission missing"
          assert "network_security_config" in manifest, "network security config missing"
          assert "windowSoftInputMode" in manifest, "keyboard handling missing"
          print(f"Android XML valid: {len(files)} files; manifest, tile and network config present.")
          PY

      - name: Sync Capacitor web assets into the Android project
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify the APK actually exists
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not produced at $APK"
            exit 1
          fi
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Release APK was not produced at $RELEASE_APK"
            exit 1
          fi
          ls -lh "$APK" "$RELEASE_APK"

      - name: Verify Quick Settings tile is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK/build-tools" -type f -name aapt2 -perm -u+x | sort -V | tail -1)"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -q "HsaiTileService" manifest.txt
          grep -q "android.service.quicksettings.action.QS_TILE" manifest.txt
          grep -q "android.permission.BIND_QUICK_SETTINGS_TILE" manifest.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("android/app/build/outputs/apk/debug/app-debug.apk") as apk:
              dex = [n for n in apk.namelist() if n.endswith(".dex")]
              assert dex, "APK has no dex files"
              blobs = b"".join(apk.read(n) for n in dex)
              assert b"HsaiTileService" in blobs, "tile class missing from dex"
              page = apk.read("assets/public/index.html").decode("utf-8")
              assert "VDPAI" in page, "VDPAI branding missing"
              assert 'id="micBtn"' in page, "voice control missing"
              assert 'id="chatForm"' in page, "chat composer missing"
              assert 'id="lowGlowToggle"' in page, "low-glow theme control missing"
              store = apk.read("assets/public/js/store.js").decode("utf-8")
              assert "nativePreferences" in store, "native Preferences storage bridge missing"
              assert 'from "@capacitor/preferences"' not in store, "bare package import would break WebView loading"
              plugins = apk.read("assets/capacitor.plugins.json").decode("utf-8")
              assert "PreferencesPlugin" in plugins, "native Preferences plugin missing"
          PY
          echo "Tile, offline HUD and native storage are present in the APK."

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK/build-tools" -type f -name aapt2 -perm -u+x | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -1)"
          "$AAPT2" dump badging "$APK" | grep -q "package: name='com.hsai.assistant'"
          "$AAPT2" dump badging "$RELEASE_APK" | grep -q "package: name='com.hsai.assistant'"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"

      - name: Stage build APK deliverables
        shell: bash
        run: |
          mkdir -p build-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk build-apks/app-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-apks/app-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-apks/vdpai-v1.0.0-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-apks/vdpai-v1.0.0-release.apk
          ls -lh build-apks/

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDPAI-Android-APK
          path: build-apks/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish APK to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VDPAI-Android-APK
          path: release-files

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          # VDPAI v1.0.0 — Personal AI Assistant (Android Release)

          Official Android build for **VDPAI (Virtual Digital Personal AI)**, inspired by JARVIS with an animated core reactor, real-time waveform visualizer, personal assistant task center, control center with app shortcuts, personal memory system, and multi-profile privacy isolation.

          ## Included APK Deliverables
          - **`app-release.apk` / `vdpai-v1.0.0-release.apk`**: Release-optimized APK (`android:debuggable=false`) signed with standard cert for universal installation on all Android devices.
          - **`app-debug.apk` / `vdpai-v1.0.0-debug.apk`**: Debug APK with developer logging enabled.

          ## System Requirements & Compatibility
          - **OS:** Android 8.0 (Oreo, API 26) through Android 15 / 16 (API 36).
          - **Architecture:** `arm64-v8a`, `armeabi-v7a`, `x86_64`.
          - **Permissions:** Internet (API connection to cloud AI models and ping telemetry), Microphone (speech-to-text; user permission required).

          ## Installation Instructions
          1. Download `app-release.apk` (or `app-debug.apk`).
          2. On your Android device, tap the downloaded APK to open the package installer.
          3. If prompted, toggle "Allow from this source" for your browser or file manager.
          4. Tap **Install** and launch **VDPAI**.
          5. Grant microphone permission when prompted to enable voice assistant features.
          EOF
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "VDPAI $TAG" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG
